[build-system]
# setuptools>=77 is required for PEP 639 license expressions
# (license = "..." + license-files), which emit Metadata-Version 2.4.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wattleflow"
# Version is set manually and must match the git tag pushed for the release.
version = "0.0.0.50"
description = "Wattleflow Core for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "framework", "core", "library", "design", "patterns", "python", "software engineering"]
requires-python = ">=3.10"
# Intentionally empty: the framework depends on the standard library only.
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "build",
    "setuptools>=77",
    "wheel"
]
#    "ruff",
#    "twine>=6.1",   # older twine rejects Metadata-Version 2.4

[project.urls]
Homepage = "https://github.com/wattleflow/core"
Repository = "https://github.com/wattleflow/core"
Documentation = "https://github.com/wattleflow/documentation"
Issues = "https://github.com/wattleflow/core/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# `wattleflow` is an implicit namespace package (no __init__.py) so that sibling
# distributions can ship wattleflow.workflow, wattleflow.processors, etc.
# This distribution owns wattleflow.core only — the explicit include keeps any
# other directory under src/wattleflow (e.g. logo/) out of the wheel.
include = ["wattleflow.core*"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731"]
