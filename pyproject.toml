[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/wattleflow/core/_version.py"
local_scheme = "no-local-version"   # no +gHASH suffix; required for PyPI uploads
version_scheme = "no-guess-dev"     # don't invent the next version off-tag


[project]
name = "wattleflow"
version = "0.0.0.38"
description = "Wattleflow Core for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "framework", "core", "library", "design", "patterns", "python", "software engineering"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/wattleflow/core.git"
Repository = "https://github.com/wattleflow/core.git"
Documentation = "https://github.com/wattleflow/docs.git"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731", "I001"]
